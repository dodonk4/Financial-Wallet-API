version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: financial-wallet-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financial_wallet

    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: financial-wallet-redis

    ports:
      - "6379:6379"